<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b55">
  <title>Thư viện offline</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Thư viện của tôi</h1>
    <p>Đọc tài liệu mọi lúc, kể cả khi offline</p>
  </header>

  <main>
    <input id="search" type="search"
      placeholder="Tìm tài liệu...">

    <section id="documents"></section>

    <article id="detail" hidden>
      <button id="back">← Quay lại</button>
      <h2 id="detail-title"></h2>
      <p id="detail-content"></p>
    </article>

    <p id="status">Đang khởi động...</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
